<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 325" width="780" height="325" role="img" aria-labelledby="title desc">
<title id="title">Pixel kitty studying software engineering</title>
<desc id="desc">Original pink pixel-art cat coding at a navy laptop, under small animated stars.</desc>
<style>
@keyframes starblink{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@keyframes catbob{0%,100%{transform:translateY(0px)}50%{transform:translateY(-4px)}}
@keyframes screen{0%,100%{opacity:.18}45%{opacity:.85}}
@keyframes tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(8deg)}}
.star{animation:starblink 3s ease-in-out infinite;transform-origin:center}.s2{animation-delay:1s}.s3{animation-delay:1.8s}
.kitty{animation:catbob 3.8s ease-in-out infinite}.screen{animation:screen 3s ease-in-out infinite}.tail{animation:tail 3.6s ease-in-out infinite;transform-origin:520px 240px}
