@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
.float{animation:float 5s ease-in-out infinite;transform-origin:center}
.twinkle{animation:twinkle 4s ease-in-out infinite}.t1{animation-delay:.6s}.t2{animation-delay:1.3s}.t3{animation-delay:2.2s}
.caret{animation:caret 1s steps(2,end) infinite}
@media (prefers-reduced-motion:reduce){.float,.twinkle,.caret{animation:none}}
</style>
